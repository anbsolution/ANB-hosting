name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npm run db:generate
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Test CPython Android package filtering
        run: python3 -m unittest discover -s android/scripts -p 'test_*.py'
      - name: Install Android native build tools
        run: sdkmanager --install "ndk;27.3.13750724" "cmake;3.22.1"
      - name: Test Android local hosting
        run: gradle -p android :app:testDebugUnitTest
      - name: Build Android debug APK
        run: gradle -p android :app:assembleDebug
      - name: Run packaged CPython import test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: gradle -p android :app:connectedDebugAndroidTest
      - name: Build signed Android release APK when the existing key is configured
        env:
          ANB_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANB_RELEASE_KEYSTORE_BASE64 }}
          ANB_RELEASE_STORE_PASSWORD: ${{ secrets.ANB_RELEASE_STORE_PASSWORD }}
          ANB_RELEASE_KEY_ALIAS: ${{ secrets.ANB_RELEASE_KEY_ALIAS }}
          ANB_RELEASE_KEY_PASSWORD: ${{ secrets.ANB_RELEASE_KEY_PASSWORD }}
          ANB_RELEASE_CERT_SHA256: ${{ secrets.ANB_RELEASE_CERT_SHA256 }}
        run: |
          if [ -z "$ANB_RELEASE_KEYSTORE_BASE64" ] || [ -z "$ANB_RELEASE_STORE_PASSWORD" ] || [ -z "$ANB_RELEASE_KEY_ALIAS" ] || [ -z "$ANB_RELEASE_KEY_PASSWORD" ] || [ -z "$ANB_RELEASE_CERT_SHA256" ]; then
            echo "Release APK skipped: signing secrets are not configured."
            exit 0
          fi
          printf '%s' "$ANB_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/anb-release-key.jks"
          chmod 600 "$RUNNER_TEMP/anb-release-key.jks"
          export ANB_RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/anb-release-key.jks"
          gradle -p android :app:assembleRelease
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "Android apksigner was not found."
            exit 1
          fi
          ACTUAL_CERT_SHA256="$("$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk 2>/dev/null | awk '/Signer #1 certificate SHA-256 digest:/ { print $NF; exit }' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_CERT_SHA256="$(printf '%s' "$ANB_RELEASE_CERT_SHA256" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [ -z "$ACTUAL_CERT_SHA256" ] || [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "Release certificate does not match ANB_RELEASE_CERT_SHA256."
            exit 1
          fi
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: anb-hosting-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload signed Android release APK
        uses: actions/upload-artifact@v4
        with:
          name: anb-hosting-android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore
